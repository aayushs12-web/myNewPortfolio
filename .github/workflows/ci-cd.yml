name: Portfolio CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKER_USER: aayushlabs
  FRONTEND_IMAGE_NAME: aayushlabs/portfolio-frontend
  BACKEND_IMAGE_NAME: aayushlabs/portfolio-backend

jobs:
  # ──────────────────────────────────────────
  # Step 1: Install Dependencies & Build Frontend
  # ──────────────────────────────────────────
  frontend-build:
    name: Frontend Build (npm ci -> npm run build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: myPortfolio_MERN/Frontend/package-lock.json

      - name: Install Frontend Dependencies (npm ci)
        working-directory: ./myPortfolio_MERN/Frontend
        run: npm ci

      - name: Build Production Frontend (npm run build)
        working-directory: ./myPortfolio_MERN/Frontend
        env:
          VITE_SERVICE_ID: ${{ secrets.VITE_SERVICE_ID }}
          VITE_TEMPLATE_ID: ${{ secrets.VITE_TEMPLATE_ID }}
          VITE_PUBLIC_KEY: ${{ secrets.VITE_PUBLIC_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: myPortfolio_MERN/Frontend/dist
          retention-days: 1

  # ──────────────────────────────────────────
  # Step 2: Validate Backend Build & Dependencies
  # ──────────────────────────────────────────
  backend-build:
    name: Backend CI (npm ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: myPortfolio_MERN/Backend/package-lock.json

      - name: Install Backend Dependencies (npm ci)
        working-directory: ./myPortfolio_MERN/Backend
        run: npm ci

  # ──────────────────────────────────────────
  # Step 3: Docker Build & Push Stage
  # ──────────────────────────────────────────
  docker-build:
    name: Docker Build & Push (aayushlabs Docker Hub)
    needs: [frontend-build, backend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend Image (Nginx)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./myPortfolio_MERN/Frontend
          file: ./myPortfolio_MERN/Frontend/Dockerfile
          push: ${{ env.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_SERVICE_ID=${{ secrets.VITE_SERVICE_ID }}
            VITE_TEMPLATE_ID=${{ secrets.VITE_TEMPLATE_ID }}
            VITE_PUBLIC_KEY=${{ secrets.VITE_PUBLIC_KEY }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./myPortfolio_MERN/Backend
          file: ./myPortfolio_MERN/Backend/Dockerfile
          push: ${{ env.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # Step 4: Production Deployment Trigger
  # ──────────────────────────────────────────
  deploy:
    name: Production Server Deployment
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Log Deployment Status
        run: |
          echo "=================================================================="
          echo "🚀  CI/CD PIPELINE EXECUTED SUCCESSFULLY!"
          echo "📦  1. npm ci & npm run build verified"
          echo "🐳  2. Docker Hub images pushed to aayushlabs/portfolio-frontend & backend"
          echo "🌐  3. Production server automated zero-downtime deployment ready"
          echo "=================================================================="

      - name: SSH Deploy to Production VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: env.SERVER_HOST != '' && env.SERVER_USER != '' && env.SSH_PRIVATE_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/portfolio || exit 1
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
