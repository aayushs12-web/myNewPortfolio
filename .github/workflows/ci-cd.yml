name: Portfolio CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: {}

env:
  FRONTEND_IMAGE_NAME: aayushlabs/portfolio-frontend
  BACKEND_IMAGE_NAME: aayushlabs/portfolio-backend

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci
        working-directory: myPortfolio_MERN/Frontend

      - name: Build Frontend
        run: npm run build
        working-directory: myPortfolio_MERN/Frontend
        env:
          VITE_SERVICE_ID: ${{ secrets.VITE_SERVICE_ID }}
          VITE_TEMPLATE_ID: ${{ secrets.VITE_TEMPLATE_ID }}
          VITE_PUBLIC_KEY: ${{ secrets.VITE_PUBLIC_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  backend-build:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci
        working-directory: myPortfolio_MERN/Backend

  docker-build:
    name: Docker Build
    needs:
      - frontend-build
      - backend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Frontend Image
        uses: docker/build-push-action@v6.15.0
        with:
          context: myPortfolio_MERN/Frontend
          file: myPortfolio_MERN/Frontend/Dockerfile
          push: false
          tags: aayushlabs/portfolio-frontend:latest

      - name: Build Backend Image
        uses: docker/build-push-action@v6.15.0
        with:
          context: myPortfolio_MERN/Backend
          file: myPortfolio_MERN/Backend/Dockerfile
          push: false
          tags: aayushlabs/portfolio-backend:latest

  deployment-status:
    name: Deployment Status
    needs:
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Log Status
        run: echo "Pipeline executed successfully!"
