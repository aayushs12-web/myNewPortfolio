version: "3.8"

services:
  # Backend Express API Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/portfolio}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Frontend React SPA served by Nginx
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_SERVICE_ID=${VITE_SERVICE_ID:-service_ugmin38}
        - VITE_TEMPLATE_ID=${VITE_TEMPLATE_ID:-template_rrvhwln}
        - VITE_PUBLIC_KEY=${VITE_PUBLIC_KEY:-1Y5QmzyMQqD78x-qz}
    container_name: portfolio_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  portfolio_network:
    driver: bridge
